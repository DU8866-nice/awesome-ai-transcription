# Source of truth for README.md and README.en.md.
# Edit this file, then run: python scripts/build_readme.py
# Each entry needs `repo`, `zh` and `en`. Keep descriptions to one or two sentences.
# Optional fields (only when the project's README says so):
#   os: [win, mac, linux, android, ios, web]
#   offline: true    can run fully on your own device, audio is not uploaded
#   byok: true       core features need your own API key for a cloud service
#   cn: true         Chinese-friendly: Chinese UI or docs, or built for Chinese use
#   note_zh / note_en: one short caveat shown under the entry

categories:
  - id: live
    zh: "实时字幕与同声传译"
    en: "Live captions and interpreting"
    zh_intro: "直接听电脑或手机正在播放的声音，给网课、会议、直播和外语视频加上实时字幕或双语翻译，不用往会议里加机器人。"
    en_intro: "Listen to whatever your computer or phone is playing and add live captions or translations to lectures, meetings, streams and foreign videos, with no bot joining the call."
    items:
      - repo: wquguru/cicada
        zh: "知了：任何会议和直播的实时双语字幕、同声传译和结构化纪要，支持腾讯会议、飞书、钉钉、Zoom、B 站直播等；按住说话键，对方能直接听到你的译文语音。"
        en: "Cicada: live bilingual captions, interpreting and structured notes for any meeting or stream, from Tencent Meeting and Feishu to Zoom and YouTube; hold a key and the other side hears your words translated."
        os: [mac, win, linux, android]
        cn: true
        note_zh: "Apple 芯片的 Mac 上全部本机识别，其他平台看 README 说明"
        note_en: "Fully on-device on Apple Silicon Macs; see the README for other platforms"
      - repo: SakiRinn/LiveCaptions-Translator
        zh: "Windows 自带“实时字幕”加翻译接口：系统识别准、占用低，再接上大模型翻译，不需要 Copilot+ PC。"
        en: "Windows Live Captions plus a translation API: accurate, lightweight system captions with LLM translation, no Copilot+ PC required."
        os: [win]
        note_zh: "需要 Windows 11"
        note_en: "Requires Windows 11"
      - repo: niyongsheng/AudioScript
        zh: "声稿：监听系统声音，把外语播客、视频和会议实时转成“原文 + 译文”双语悬浮字幕，识别和翻译都在本机完成，作者称是讯飞同传的免费平替。"
        en: "AudioScript turns system audio from podcasts, videos and meetings into floating bilingual captions, with recognition and translation done on your machine."
        os: [mac, win, linux]
        offline: true
        cn: true
      - repo: HiMeditator/auto-caption
        zh: "跨平台实时字幕显示软件，可用 Vosk、SenseVoice 等本地模型，也能接 Ollama 或在线接口做翻译。"
        en: "A cross-platform live caption overlay that runs local models such as Vosk and SenseVoice, with optional translation through Ollama or online APIs."
        os: [win, mac, linux]
        offline: true
        cn: true
      - repo: yuxino/Mimi
        zh: "给正在播放的视频、直播和网课加实时翻译字幕，可以只听指定应用的声音，字幕可导出为笔记；默认不保存录音。"
        en: "Adds live translated captions to whatever video, stream or class is playing; it can listen to a single app and export captions as notes, and saves nothing by default."
        os: [mac, win, linux, android]
        byok: true
        note_zh: "Apple 芯片 Mac（macOS 26 以上）可用苹果本地识别，其他情况需要自备服务商 API Key"
        note_en: "Apple Silicon Macs on macOS 26+ can use on-device Apple speech; otherwise you need your own provider key"
      - repo: KorenKrita/simul-subtitle
        zh: "日语、英语视频和直播的同传悬浮字幕，浮在任何播放器上方；语音识别在本地离线完成，翻译用你自己的大模型接口。"
        en: "Floating live-interpreting captions for Japanese and English videos and streams over any player; recognition runs offline on the device and translation uses your own LLM key."
        os: [android, mac, win]
        byok: true
      - repo: TheDeathDragon/LiveTranslate
        zh: "Windows 实时音频翻译：抓取系统声音和麦克风，本地识别后交给大模型翻译，透明浮窗显示。"
        en: "Real-time audio translation for Windows: captures system audio and the mic, recognizes speech locally and translates through an LLM API in a transparent overlay."
        os: [win]
        byok: true
      - repo: franklioxygen/v2s
        zh: "macOS 菜单栏双语字幕条：可只抓某个应用的声音，用苹果系统自带的本地识别和翻译，还能生成摘要。"
        en: "A macOS menu-bar bilingual caption bar that can capture a single app, using Apple's on-device speech and translation, with summaries."
        os: [mac]
        offline: true
      - repo: oboroge0/hayamimi
        zh: "只用 CPU 的多语言实时转写：实时字幕、网页面板、说话人标注和即时翻译，不需要显卡和云端接口。"
        en: "Multilingual real-time transcription on CPU only: live subtitles, a browser dashboard, speaker labels and translation, with no GPU or cloud API."
        offline: true
      - repo: abb128/LiveCaptions
        zh: "Linux 桌面的实时字幕，桌面声音和麦克风都能识别，音频不发往任何地方。"
        en: "Live captions for the Linux desktop from desktop or mic audio, which is never sent anywhere."
        os: [linux]
        offline: true
        note_zh: "目前只支持英语"
        note_en: "English only for now"

  - id: meetings
    zh: "AI 会议纪要"
    en: "AI meeting notes"
    zh_intro: "Granola、Otter、飞书妙记的开源替代：录下会议声音，转成文字、分清说话人，再整理成纪要和待办。"
    en_intro: "Open-source alternatives to Granola, Otter and similar tools: record the meeting, transcribe it, label speakers and turn it into notes and to-dos."
    items:
      - repo: Zackriya-Solutions/meetily
        zh: "注重隐私的 AI 会议助手：在本机用 Whisper 或 Parakeet 转写，纪要可用本地 Ollama，也可接 Claude、Groq 等。"
        en: "A privacy-first meeting assistant that transcribes on your machine with Whisper or Parakeet and summarizes with local Ollama or providers like Claude and Groq."
        os: [win, mac, linux]
        offline: true
        note_zh: "Linux 用一行命令安装；Windows 安装包需要支持 AVX2 的 CPU"
        note_en: "One-line install on Linux; the Windows installer needs an AVX2 CPU"
      - repo: fastrepl/anarlog
        zh: "本地优先的开源会议记事本，Granola 的开源替代，社区版保持 MIT 开源。"
        en: "A local-first open-source meeting notepad and Granola alternative; the community app stays MIT-licensed."
        os: [mac, win, linux]
      - repo: FrigadeHQ/yogurt
        zh: "Granola 的免费开源替代：不往会议里加机器人，实时转写、自动写纪要，笔记留在你的电脑上。"
        en: "A free, open-source Granola alternative that records calls without a bot, transcribes live and writes summaries, with notes kept on your computer."
        os: [mac, win, linux]
      - repo: tancheng33/tingo
        zh: "听过：为中文会议做的本地纪要工具，录腾讯会议、飞书、Zoom 和麦克风，本地用 FunASR 转写并区分说话人，纪要里每条结论都能点回原话。"
        en: "Tingo, a local meeting-notes tool built for Chinese: records Tencent Meeting, Feishu, Zoom and your mic, transcribes and labels speakers locally with FunASR, and links every conclusion back to the recording."
        os: [win, mac, linux]
        offline: true
        cn: true
        note_zh: "纪要可用 DeepSeek、通义千问等接口，也可用本地 Ollama 全程断网"
        note_en: "Summaries can use DeepSeek or Qwen APIs, or local Ollama fully offline"
      - repo: Muesli-HQ/muesli
        zh: "macOS 原生的听写和会议转写应用，默认本机识别，不加会议机器人，可把纪要交给 ChatGPT 或 Codex 继续处理。"
        en: "A native macOS app for dictation and meeting transcription, on-device by default with no meeting bot, and a plugin for ChatGPT and Codex."
        os: [mac]
        offline: true
      - repo: silverstein/minutes
        zh: "本机录音转写会议、通话和语音备忘，存成你自己的 Markdown 文件，再让 Claude Code、Codex 等通过 MCP 检索。"
        en: "Records and transcribes meetings, calls and voice memos on your device into Markdown you own, searchable from Claude Code, Codex or any MCP client."
        os: [mac, linux]
      - repo: moona3k/macparakeet
        zh: "Apple 芯片 Mac 上的本地语音应用：全局听写、音视频文件转写和会议录音三合一。"
        en: "A local-first voice app for Apple Silicon Macs that combines dictation, file transcription and meeting recording."
        os: [mac]
        offline: true
      - repo: infiniV/VoiceFlow
        zh: "Windows 和 Linux 的本地 Whisper 听写，新版加入会议模式：同时录麦克风和系统声音，本地转写后用你自己的大模型写纪要。"
        en: "Local Whisper dictation for Windows and Linux, now with a meeting mode that records mic and system audio and summarizes with your own LLM."
        os: [win, linux]
        offline: true
      - repo: impossibleG/phorminx
        zh: "Windows 上的本地听写、会议和研究笔记工具，可搜索文字稿，不用付费 AI 服务也能做格式整理。"
        en: "Local-first dictation, meetings and research notes for Windows, with searchable transcripts and AI formatting without a paid AI service."
        os: [win]
      - repo: nexmoe/DayBee
        zh: "托盘常驻的长时间录音应用，自动分段存档，可用苹果系统识别或 SenseVoice、Qwen3-ASR 等本地模型实时转写。"
        en: "A tray recorder for long sessions that splits and archives audio and transcribes live with Apple speech or local models such as SenseVoice and Qwen3-ASR."
        os: [mac]
        offline: true

  - id: dictation
    zh: "语音输入：说话代替打字"
    en: "Dictation: speak instead of typing"
    zh_intro: "按住快捷键说话，松开文字就出现在光标处，很多还能用大模型顺手润色。Wispr Flow、Superwhisper 的开源替代。"
    en_intro: "Hold a hotkey, speak, and the text appears at your cursor, often cleaned up by an LLM. Open-source alternatives to Wispr Flow and Superwhisper."
    items:
      - repo: cjpais/Handy
        zh: "免费开源、完全离线的语音输入：按快捷键说话，文字出现在任何输入框，不往云端发送任何信息。"
        en: "Free, open-source and fully offline: press a shortcut, speak, and your words appear in any text field without anything sent to the cloud."
        os: [win, mac, linux]
        offline: true
      - repo: OpenWhispr/openwhispr
        zh: "Wispr Flow 和 Granola 的开源替代：语音输入、会议转写和笔记，可用本地 Parakeet、Whisper，也可接自己的云端接口。"
        en: "An open-source alternative to Wispr Flow and Granola for dictation, meeting transcription and notes, with local Parakeet or Whisper or your own cloud keys."
        os: [mac, win, linux]
        offline: true
      - repo: HaujetZhao/CapsWriter-Offline
        zh: "按住 CapsLock 说话、松开上屏的 Windows 离线语音输入，中文数字自动转换、热词和正则替换，还能把音视频文件转成字幕。"
        en: "Hold Caps Lock to talk, release to type: offline voice input for Windows with Chinese number formatting, hotwords and rules, plus file-to-subtitle transcription."
        os: [win]
        offline: true
        cn: true
      - repo: Beingpax/VoiceInk
        zh: "macOS 上几乎即时的语音转文字应用，注重隐私和效率。"
        en: "A macOS voice-to-text app that transcribes almost instantly, built for privacy and speed."
        os: [mac]
        note_zh: "源码开源可自行编译；官网编译版收费，提供免费试用"
        note_en: "Open source to build yourself; the official builds are paid with a free trial"
      - repo: yan5xu/ququ
        zh: "蛐蛐：为中文用户做的 Wispr Flow 开源替代，本地用 FunASR 识别，再用可配置的大模型整理文字。"
        en: "QuQu, a Wispr Flow alternative for Chinese users that recognizes speech locally with FunASR and tidies text with a configurable LLM."
        cn: true
      - repo: joewongjc/type4me
        zh: "免费开源的 macOS 语音输入法，边说边出字，还能一键润色、翻译或向 AI 提问；识别引擎和大模型由你选，历史存在本机。"
        en: "A free macOS voice input method that types as you speak and can polish, translate or ask AI in one step; you choose the engines, and history stays local."
        os: [mac, ios]
        cn: true
        note_zh: "推荐的云端版需要自备语音识别和大模型 API Key"
        note_en: "The recommended cloud build needs your own speech and LLM keys"
      - repo: Starmel/OpenSuperWhisper
        zh: "macOS 实时录音转写，可选 Whisper 或 Parakeet 引擎，支持自定义快捷键。"
        en: "Real-time recording and transcription on macOS with Whisper or Parakeet and custom shortcuts."
        os: [mac]
        offline: true
      - repo: TypeWhisper/typewhisper-mac
        zh: "macOS 语音转文字加 AI 文本处理：本机模型或 Groq、OpenAI 等云端接口，结果可套用可复用的工作流。"
        en: "Speech-to-text and AI text processing for macOS with on-device models or cloud APIs like Groq and OpenAI, plus reusable workflows."
        os: [mac]
      - repo: amicalhq/amical
        zh: "本地优先的 AI 听写应用，用开源模型识别，可接 Ollama 润色。"
        en: "A local-first AI dictation app powered by open models, with optional Ollama cleanup."
        os: [mac, win]
      - repo: AbhishekBarali/SpeakoFlow
        zh: "免费开源的语音输入和 AI 助手，默认本地运行，说话打字、提问回答，还能整理会议纪要。"
        en: "Free, open-source voice typing and an AI assistant that runs locally by default, answers questions and can write up meeting notes."
        os: [win, mac, linux]
        offline: true
      - repo: voquill/voquill
        zh: "跨平台 AI 语音打字：在任何桌面应用里听写，AI 清理文字稿，个人词库同步。"
        en: "Cross-platform AI voice typing that dictates into any desktop app, cleans up the transcript and keeps a personal glossary in sync."
        os: [win, mac, linux]
      - repo: tover0314-w/opentypeless
        zh: "Wispr Flow、Superwhisper 的开源替代：语音输入、改写和语音问答，支持自带 API Key 或本地 Ollama。"
        en: "An open-source alternative to Wispr Flow and Superwhisper for voice input, rewriting and voice Q&A, with your own keys or local Ollama."
        os: [mac, win, linux]
      - repo: crosswk/SayIt
        zh: "随口说、出色写：按快捷键说话，AI 把口语整理成书面文字，直接输入到光标位置。"
        en: "Press a shortcut and speak; AI turns casual speech into written text right at your cursor."
        os: [win, mac]
        cn: true
      - repo: opennookorg/betterwispr
        zh: "macOS 免费开源听写：按住 ⌥ 空格说话，本机用 Whisper、Parakeet 或苹果语音识别，选了云端接口才会上传。"
        en: "Free macOS dictation: hold ⌥ Space and speak; Whisper, Parakeet or Apple speech run on your Mac, and audio leaves only if you pick a cloud option."
        os: [mac]
        offline: true
      - repo: VocaHQ/vocalinux
        zh: "Linux 上 100% 离线的语音听写，在任何地方说话打字，基于 whisper.cpp 等引擎。"
        en: "100% offline voice dictation for Linux that types anywhere, built on whisper.cpp and other engines."
        os: [linux]
        offline: true
      - repo: goodroot/hyprwhspr
        zh: "Linux 原生全局听写，支持 Parakeet、Whisper、Qwen3-ASR 等多种引擎，主流发行版都能装。"
        en: "Native system-wide dictation for Linux with Parakeet, Whisper, Qwen3-ASR and more, packaged for major distros."
        os: [linux]
      - repo: peteonrails/voxtype
        zh: "Wayland 下按住热键说话的听写工具，普通 CPU 上也能跑出 9–11 倍实时速度，默认本地运行。"
        en: "Push-to-talk dictation for Wayland that runs 9–11× realtime on a plain CPU and stays local by default."
        os: [linux]
        offline: true
      - repo: HD838A/remote-mic-app
        zh: "无线麦 SayAll：把小米蓝牙遥控器 2 / 2 Pro 变成 Mac 的语音输入设备，拿着遥控器就能说话打字、控制 Mac。"
        en: "SayAll turns a Xiaomi Bluetooth remote into a voice input device for your Mac, so you can dictate and control the Mac from the remote."
        os: [mac]
        cn: true

  - id: files
    zh: "录音、音视频转文字和字幕生成"
    en: "Transcribe recordings and make subtitles"
    zh_intro: "把课程录音、采访、播客和视频文件转成文字稿或字幕，很多还能翻译字幕、整理笔记。"
    en_intro: "Turn lecture recordings, interviews, podcasts and videos into transcripts or subtitles, often with translation and notes."
    items:
      - repo: chidiwilliams/buzz
        zh: "在自己电脑上离线转写和翻译音频，基于 OpenAI Whisper，有图形界面，最老牌的选择之一。"
        en: "Transcribes and translates audio offline on your own computer with OpenAI Whisper, behind a simple GUI; one of the best-known options."
        os: [win, mac, linux]
        offline: true
        note_zh: "Intel Mac 最后支持的版本是 1.4.5"
        note_en: "1.4.5 is the last version for Intel Macs"
      - repo: thewh1teagle/vibe
        zh: "在本机转写音频和视频，界面简洁，支持多种导出格式。"
        en: "Transcribes audio and video right on your device with a simple interface and several export formats."
        os: [win, mac, linux]
        offline: true
      - repo: buxuku/SmartSub
        zh: "妙幕：视频转字幕、字幕翻译、AI 配音和字幕烧录的一站式桌面工具，用 Whisper、FunASR 等本地模型离线识别，可批量处理。"
        en: "SmartSub, an all-in-one desktop tool for video-to-subtitles, subtitle translation, AI dubbing and burn-in, with offline Whisper or FunASR and batch processing."
        os: [win, mac, linux]
        offline: true
        cn: true
      - repo: modelscope/FunClip
        zh: "阿里通义实验室的开源视频剪辑工具：用 FunASR 识别出文字稿，选中文字就能剪出对应片段并生成字幕，本地运行。"
        en: "An open-source clipping tool from Alibaba's Tongyi lab: FunASR transcribes the video, you select text to cut the matching clips and subtitles, all locally."
        offline: true
        cn: true
      - repo: aTrainTranscription/aTrain
        zh: "格拉茨大学研究者开发的离线转写工具，适合访谈和研究录音，自动区分说话人，不上传任何数据。"
        en: "An offline transcription tool from University of Graz researchers for interviews and research recordings, with speaker labels and no uploads."
        os: [win, mac, linux]
        offline: true
      - repo: harry0703/AudioNotes
        zh: "本地把会议、访谈、课程和语音备忘转成文字，整理成 Markdown 笔记，还能针对内容提问；用 FunASR 和 Ollama，默认不发给第三方。"
        en: "Turns meetings, interviews, lectures and voice memos into transcripts and Markdown notes you can ask questions about, locally with FunASR and Ollama."
        offline: true
        cn: true
      - repo: Blue-B/WhisperSubTranslate
        zh: "把视频变成多语言字幕：本地用 whisper.cpp 生成字幕，再用下载的离线翻译模型或在线引擎翻译。"
        en: "Turns any video into multilingual subtitles locally: whisper.cpp makes the SRT, then a downloaded offline model or an online engine translates it."
        offline: true
      - repo: corvo007/MioSub
        zh: "能读懂上下文的 AI 字幕编辑器：贴链接后自动完成下载、转录、翻译和压制，省去逐句校对机翻。"
        en: "A context-aware AI subtitle editor that downloads, transcribes, translates and burns in subtitles from a link, so you don't proofread machine translation line by line."
        cn: true

