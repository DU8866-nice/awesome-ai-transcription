        en: "No-root real-time screen translation for Android games, visual novels and comics, with on-device or cloud OCR and offline LLMs, drawn right over the screen."
        os: [android]

  - id: mobile
    zh: "手机和智能眼镜"
    en: "Phones and smart glasses"
    zh_intro: ""
    en_intro: ""
    items:
      - repo: Notely-Voice/NotelyVoice
        zh: "完全私密的 AI 语音转写和笔记应用，手机上用 Whisper 离线识别 100 多种语言，适合记课堂、会议和问诊。"
        en: "A fully private voice transcription and notes app that runs Whisper offline on your phone in 100+ languages, for lectures, meetings and more."
        os: [android, ios]
        offline: true
